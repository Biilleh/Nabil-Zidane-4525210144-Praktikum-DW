<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
</head>

<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f56e6e; margin: 30px; padding: 20px; line-height: 1.6;">

    <hr style="border: 3px solid white; width: 80%;">

    <div style="text-align: center; margin-bottom: 20px; padding: 20px;">

        <img class="foto-profil" 
             src="image/profile.jpg" 
             alt="profil" 
             style="width: 250px; height: 300px; border-radius: 20px; border: 5px solid white; object-fit: cover; box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);">

        <h1 style="color: white; font-size: 32px; font-weight: bold; text-align: center; letter-spacing: 3px; text-transform: uppercase;">
            Randhika
        </h1>

    </div>

    <div style="background-color: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 15px;">

        <!-- data mahasiswa -->
        <h2 style="color: rgb(0, 102, 153); font-size: 22px; font-weight: bold; border-bottom: 3px solid rgb(201, 0, 77); padding-bottom: 8px;">
            Data Pribadi
        </h2>

        <p class="data-pribadi" style="color: #020041; font-size: 18px; margin-left: 20px;">
            Nama: Randhika
        </p>
        <p class="data-pribadi" style="color: #020041; font-size: 18px; margin-left: 20px;">
            Prodi: Teknik Informatika
        </p>
        <p class="data-pribadi" style="color: #020041; font-size: 18px; margin-left: 20px;">
            Universitas: Universitas Pancasila
        </p>

    </div>

</body>
</html>
